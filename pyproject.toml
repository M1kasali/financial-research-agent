[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Evidence-grounded financial research; incremental AFAC migration"
requires-python = ">=3.12"
dependencies = ["jieba>=0.42.1,<0.43", "PyYAML>=6,<7", "requests>=2.31,<3", "python-dotenv>=1,<2", "scipy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
pdf = ["PyMuPDF>=1.24,<2", "pdfplumber>=0.11,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7"]

[project.scripts]
financial-agent = "financial_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src", "vendor"]
include = ["financial_agent*", "agent", "agent.*", "agent_team_b1*", "agent_team_v7*", "agent_team_v9*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["vendor", "tests/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
